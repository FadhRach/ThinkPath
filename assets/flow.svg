<text x="880.0" y="78" font-size="12.5" font-weight="600" fill="#086361" text-anchor="middle">bukti cukup: langsung beri nilai</text>
<rect x="24" y="590" width="1152" height="44" rx="12" fill="#DDF3E7" stroke="none" stroke-width="2"/>
<text x="600" y="618" font-size="14.5" font-weight="600" fill="#2C9A62" text-anchor="middle">Skor AI hanya terlihat oleh dosen. ThinkPath menyajikan bukti untuk ditinjau, bukan vonis, dan tidak menjatuhkan sanksi.</text>
