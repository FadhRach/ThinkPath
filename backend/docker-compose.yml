# Produksi di VPS 1 GB RAM. Nilai dari .env (VPS) atau .env.docker (uji di Mac, lewat Makefile).

name: thinkpath

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    # Tuning RAM kecil; 1 worker x 8 thread memakai paling banyak 8 koneksi.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=30
      -c wal_buffers=4MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Hanya loopback, untuk GUI lewat SSH tunnel. 5433 agar tidak bentrok dengan
    # Postgres lokal di laptop (5432) saat di-tunnel. Jangan pernah 0.0.0.0.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 320m
    logging: *logging

  api:
    build: .
    image: thinkpath-api:latest
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?isi DJANGO_SECRET_KEY di .env}
      API_DOMAIN: ${API_DOMAIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      WINSTON_API_KEY: ${WINSTON_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 320m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?isi API_DOMAIN di .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
