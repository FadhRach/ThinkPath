# Produksi di VPS 1 GB RAM. Nilai dari .env (VPS) atau .env.docker (uji di Mac, lewat Makefile).

name: thinkpath

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    # Tuning RAM kecil; 1 worker x 8 thread memakai paling banyak 8 koneksi.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=30
      -c wal_buffers=4MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Hanya loopback, untuk GUI lewat SSH tunnel. 5433 agar tidak bentrok dengan
    # Postgres lokal di laptop (5432) saat di-tunnel. Jangan pernah 0.0.0.0.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 320m
    logging: *logging

  api:
    build: .
    image: thinkpath-api:latest
    platform: linux/amd64  # wheel PyMuPDF musllinux hanya x86_64; VPS sudah x86_64
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?isi DJANGO_SECRET_KEY di .env}
      API_DOMAIN: ${API_DOMAIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      WINSTON_API_KEY: ${WINSTON_API_KEY:-}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-}
      # Email reset sandi (SMTP). Kosong = tautan hanya dicetak ke log container.
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-ThinkPath <noreply@thinkpath.local>}
    volumes:
      - media:/app/data/media  # dokumen unggahan + teks hasil OCR
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 320m
    cap_drop: [ALL]  # gunicorn di port 8000 sebagai non-root tidak butuh capability
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    logging: *logging

  # Mengerjakan antrean analisis (Winston + Groq, sampai ~20 detik per jawaban)
  # di luar request web, jadi lonjakan pengumpulan menjelang tenggat tidak
  # menyumbat 8 thread gunicorn. Image yang sama dengan api; entrypoint sendiri
  # supaya tidak ikut `migrate` (hanya api yang bermigrasi, worker menunggu api sehat).
  worker:
    image: thinkpath-api:latest
    platform: linux/amd64
    restart: unless-stopped
    entrypoint: ["python", "manage.py", "run_analysis_worker"]
    command: ["--threads", "3"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?isi DJANGO_SECRET_KEY di .env}
      API_DOMAIN: ${API_DOMAIN}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      WINSTON_API_KEY: ${WINSTON_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    # Berkas denyut disentuh tiap 5 detik; lebih tua dari semenit berarti macet.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/analysis-worker.heartbeat')<60 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 160m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?isi API_DOMAIN di .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Folder, bukan berkas: `git pull` mengganti berkas dengan inode baru, dan
      # mount berkas tunggal tetap menunjuk yang lama sampai container dibuat ulang.
      - ./deploy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    logging: *logging

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
