# Pemeriksaan otomatis pada setiap push dan pull request.
# Sebelumnya tidak ada CI sama sekali: 460 tes backend dan tes frontend tidak
# menghalangi merge apa pun.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # sama dengan image produksi
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pip-audit
      - name: Tes (selalu SQLite in-memory)
        run: python manage.py test
      - name: Konfigurasi produksi valid
        run: python manage.py check --deploy --settings=config.settings.production
        env:
          DJANGO_SECRET_KEY: ci-Ab3dE9fGh1JkLm4NpQ7rStUv0WxYz2Ab3dE9fGh1JkLm4NpQ7rSt
          API_DOMAIN: api.example.com
      - name: Audit dependensi
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - name: Build produksi
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: https://api.example.com
      # Tidak memblokir: advisori rantai build (tailwind/postcss) tidak ikut runtime.
      - run: npm audit --omit=dev
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image API terbangun
        run: docker build --platform linux/amd64 -t thinkpath-api:ci backend
      - name: Berjalan sebagai non-root
        run: test "$(docker run --rm --entrypoint id thinkpath-api:ci -u)" != "0"
